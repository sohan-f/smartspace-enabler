name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build module APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # .sdk holds build-tools + platform (~126 MB) and the module signing key, so both the
      # download and the APK signature stay stable across runs.
      - name: Cache Android SDK packages and signing key
        uses: actions/cache@v6
        with:
          path: .sdk
          key: android-sdk-${{ hashFiles('build.sh') }}
          restore-keys: |
            android-sdk-

      - name: Build, sign, verify
        run: ./build.sh

      - name: Job summary
        if: always()
        run: |
          if [ -f build/summary.txt ]; then
            {
              echo "### Smartspace Enabler module - build summary"
              echo '```'
              cat build/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: smartspace-enabler
          path: build/smartspace-enabler-1.0.apk
          if-no-files-found: error
