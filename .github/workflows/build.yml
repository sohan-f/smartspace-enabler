name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download Android build tools
        run: |
          mkdir -p deps
          curl -L -o deps/libxposed-api-102.jar \
            https://github.com/libxposed/api/releases/download/102.0.0/api-102.0.0.jar
          curl -L -o deps/android.jar \
            https://raw.githubusercontent.com/Sable/android-platforms/master/android-36/android.jar
          curl -L -o build-tools.zip \
            https://dl.google.com/android/repository/build-tools_r36.0.0-linux.zip
          unzip -q build-tools.zip -d deps/
          mv deps/android-36 deps/build-tools

      - name: Compile
        run: |
          mkdir -p build
          javac -source 17 -target 17 \
            -cp deps/libxposed-api-102.jar:deps/android.jar \
            -d build \
            smartspace-module/app/src/main/java/com/android/smartspaceenabler/EnableSmartspaceModule.java

      - name: Create DEX
        run: |
          deps/build-tools/d8 \
            --lib deps/android.jar \
            --output build/ \
            build/com/android/smartspaceenabler/EnableSmartspaceModule.class

      - name: Package APK
        run: |
          mkdir -p apk
          cp build/classes.dex apk/
          cp -r smartspace-module/app/src/main/resources/META-INF apk/

          deps/build-tools/aapt2 link \
            -o apk/unsigned.apk \
            -I deps/android.jar \
            --manifest smartspace-module/app/src/main/AndroidManifest.xml \
            --java build/

          cd apk && zip -j unsigned.apk classes.dex && cd ..

          deps/build-tools/zipalign -f 4 apk/unsigned.apk apk/aligned.apk

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          deps/build-tools/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out smartspace-enabler.apk \
            apk/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartspace-enabler
          path: smartspace-enabler.apk
